# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: persistence_io
    status: active
    pattern: direct_call          # owners call SaveService API directly (it is Core infrastructure, not a gameplay peer)
    producer: save-service
    consumers:
      - merit-system              # reads/writes [merit]/[unlocks]/[stats]; calls save() on discrete events
    adr: docs/architecture/adr-0005-save-load-persistence.md
    signal_signature: "save_completed(success: bool); save_loaded(schema_version: int)"
    api: "SaveService.get_value/set_value/get_section/save/load/reset"
    referenced_by:
      - docs/architecture/adr-0005-save-load-persistence.md
      - design/gdd/merit-system.md
    added: 2026-06-04
    revised: ""

  - contract: damage_delivery
    status: active
    pattern: direct_call          # weapon calls target.take_damage(); target owns/mutates own HP. NOT signal-delivered.
    producer: weapon-system       # (and enemy → player contact)
    consumers:
      - enemy                     # take_damage() decrements own HP, emits damage_taken
      - player                    # take_damage() decrements own HP, emits health_changed
      - status-effects            # observes damage_dealt (source-side notification, incl amount==0)
    adr: docs/architecture/adr-0007-combat-damage-pipeline.md
    signal_signature: "take_damage(amount: float, damage_type: int, source_kind: int, source: Node)  # delivery; damage_dealt(payload:{source,target,amount,damage_type,source_kind})  # 5-field after-the-fact notification, NOT delivery"
    note: "Resolves control-manifest C-1 (manifest wrongly said signal-delivered) + C-3 (manifest had 2-field damage_dealt). Target owns HP (Core Rule 3)."
    referenced_by:
      - docs/architecture/adr-0007-combat-damage-pipeline.md
      - design/gdd/combat-system.md
    added: 2026-06-04
    revised: ""

  - contract: targeting_queries
    status: active
    pattern: direct_call          # weapons call Targeting.find_*; Targeting holds a single-frame enemy cache
    producer: targeting           # Player-scoped Targeting node
    consumers:
      - weapon-system             # find_nearest / find_k_nearest / find_in_radius — never scan the tree directly
    adr: docs/architecture/adr-0009-targeting-service-cache.md
    api: "Targeting.find_nearest/find_k_nearest/find_in_radius; mark_dirty() on spawn/despawn; cache rebuilds ≤1×/frame"
    note: "Resolves control-manifest C-2 (service was asserted but unbuilt). Stage-2 84-enemy perf prerequisite."
    referenced_by:
      - docs/architecture/adr-0009-targeting-service-cache.md
      - design/gdd/targeting-system.md
    added: 2026-06-04
    revised: ""

  - contract: run_lifecycle_signals
    status: active
    pattern: signal               # StageDirector emits 9 canonical signals; subscribers connect directly in _ready()
    producer: stage-director
    consumers:
      - hud
      - combat-feedback
      - audio-system
      - demon-seal
      - boss
      - merit-system              # run-end edge + RunDirector metric accessors
    adr: docs/architecture/adr-0010-run-lifecycle-signals.md
    signal_signature: "stage_time_changed, boss_warning_started, boss_spawned, elite_spawned, demon_seal_spawned, demon_seal_progress_changed, demon_seal_completed, stage_cleared, stage_failed"
    note: "RunDirector exposes get_total_elapsed/get_stages_cleared/get_bosses_defeated for Merit. Timing = 3-min stage / 7-stage run (ADR-0004), NOT 5-min."
    referenced_by:
      - docs/architecture/adr-0010-run-lifecycle-signals.md
      - design/gdd/run-state.md
    added: 2026-06-04
    revised: ""

  - contract: combat_events_broadcast
    status: active
    pattern: event_bus           # CombatEvents autoload — stateless signal relay for broadcast combat events
    producer: enemy              # each enemy emits enemy_killed before queue_free()
    consumers:
      - element-system           # ComboManager connects once for 燎原 (Fire-kill chain burst)
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    signal_signature: "CombatEvents.enemy_killed(kill_data: EnemyKillData)  # EnemyKillData extends RefCounted: source_element:String, damage:float, position:Vector2 — VALUE data only, never the Node"
    referenced_by:
      - docs/architecture/adr-0006-element-system-pipeline.md
      - design/gdd/elements-five-phases.md
    added: 2026-06-04
    revised: ""

  - contract: combo_state
    status: active
    pattern: direct_call         # ComboManager (child of Player) exposes accessors; weapons/Player read on demand
    producer: element-system     # ComboManager
    consumers:
      - player                   # 熔岩甲 shield / 春生 regen
      - weapon-system            # 矿脉精粹 pierce + crit chance
      - status-effects           # 寒露凝锋 frost_slow (refresh-only guard owned by Status Effects)
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    api: "ComboManager.is_combo_active/get_pierce_bonus/get_ore_crit_chance/get_shield_params/get_regen_params; signal combo_activated(combo_id)"
    referenced_by:
      - docs/architecture/adr-0006-element-system-pipeline.md
      - design/gdd/elements-five-phases.md
    added: 2026-06-04
    revised: ""

