# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: gameplay_logic_in_save_service
    status: active
    description: "SaveService must hold ONLY serialization + schema/migration. No scoring, unlock-chain, difficulty, or any gameplay rules may live in it — those stay in their owning systems, which call SaveService to persist primitives."
    why: "SaveService is a justified infrastructure singleton (first autoload in the project) ONLY because it has no gameplay logic. Letting rules migrate into it would create exactly the hidden-coupling singleton the project bans (technical-preferences.md Forbidden Patterns)."
    adr: docs/architecture/adr-0005-save-load-persistence.md
    added: 2026-06-04

  - pattern: direct_save_file_access
    status: active
    description: "No system other than SaveService may open, read, or write user://save.cfg directly (no raw FileAccess/ConfigFile on the save path). Go through the SaveService API."
    why: "Single-owner file IO prevents partial writes, section collisions, and races. ADR-0005 R-1 (atomic-write) and R-2 (Variant limits) are only enforceable if IO is centralized."
    adr: docs/architecture/adr-0005-save-load-persistence.md
    added: 2026-06-04

  - pattern: gameplay_logic_in_combat_events
    status: active
    description: "CombatEvents autoload is a stateless signal relay ONLY. No state, no rules, no logic — just `signal` declarations and emit pass-through. Logic lives in the systems that emit/consume."
    why: "CombatEvents is a justified infrastructure autoload (like SaveService) ONLY because it carries no gameplay logic. It is the second and intended-final infrastructure autoload of this tier; accreting logic into it would recreate the banned logic-owning singleton."
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    added: 2026-06-04

  - pattern: per_enemy_signal_connect_for_broadcast
    status: active
    description: "Do NOT connect a listener to each enemy instance's signal (e.g. ComboManager connecting to every enemy.died) for broadcast events. Emit to the CombatEvents bus and connect once."
    why: "At 50-100 enemies, per-instance connection means 50-100 live connections, per-spawn bookkeeping, and dangling-callable hazards on queue_free(). A single bus connection eliminates all three (godot-specialist, ADR-0006). Emitted payloads carry VALUE data only — never the freed Node."
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    added: 2026-06-04

  - pattern: cross_system_hp_write
    status: active
    description: "A system must NEVER write another system's HP directly (`other.hp -= dmg`). Call `other.take_damage(amount, damage_type, source_kind, source)` — the target mutates its OWN HP and emits its target-side signal. `damage_dealt` is a notification, not a delivery mechanism."
    why: "Target-owned HP (Combat Core Rule 3) is the tested, shipped model. Direct cross-system HP writes create races and break ownership. NOTE: this corrects control-manifest C-1, which previously (wrongly) said damage is signal-delivered."
    adr: docs/architecture/adr-0007-combat-damage-pipeline.md
    added: 2026-06-04

  - pattern: per_frame_tree_scan_in_combat
    status: active
    description: "No combat code may call `get_nodes_in_group(\"enemies\")` (or equivalent tree scans) per-frame per-caller. Go through the Targeting service's single-frame cache (Targeting.find_*)."
    why: "At 84 enemies, 20+ per-frame group scans is the dominant avoidable cost (ADR-0008 R-1 swarm budget). The Targeting cache (ADR-0009) collapses them to 1 scan/frame. [Grandfather note: existing self-iterating weapons are exempt until the ADR-0009 migration lands — see control-manifest C-2 PLANNED tag.]"
    adr: docs/architecture/adr-0009-targeting-service-cache.md
    added: 2026-06-04

