# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: crit_multiplier_resolution
    status: active
    api: "maxf(fire_eyes_modifier, ore_crit_roll)  # pull model at damage-calc time"
    not: "shared mutable crit slot (push model) — frame-order-dependent / non-deterministic"
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    reason: "Two systems (Active Skills 火眼金睛 + Five Phases 矿脉精粹) publish a crit multiplier; Combat pulls both and takes maxf() at calc time. Order-independent, stateless, deterministic with seeded RNG. maxf (typed) not max (Variant) in the per-hit hot path. Five Phases Formula 8."
    referenced_by:
      - docs/architecture/adr-0006-element-system-pipeline.md
      - design/gdd/elements-five-phases.md
      - design/gdd/active-skills.md
    added: 2026-06-04
    revised: ""

  - purpose: crit_roll_rng
    status: active
    api: "RandomNumberGenerator instance (seeded, injectable)"
    not: "global randf() — breaks test determinism"
    adr: docs/architecture/adr-0006-element-system-pipeline.md
    reason: "矿脉精粹 crit roll must be deterministic under test (coding-standards test-determinism rule). ComboManager owns a seeded RNG; tests inject a pre-seeded instance."
    referenced_by:
      - docs/architecture/adr-0006-element-system-pipeline.md
    added: 2026-06-04
    revised: ""

