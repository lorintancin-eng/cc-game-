# resources/enemies/*.tres registered. Items / formulas empty — to be filled
# as single-system GDDs are authored.
#
# RULES:
#   - Only register facts that cross system boundaries (used by 2+ GDDs)
#   - Never delete entries — set status: deprecated
#   - When a value changes: update value, set revised: to today, comment old value
#   - source: is the authoritative GDD that "owns" this fact

