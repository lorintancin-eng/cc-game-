# ─── FORMULAS ──────────────────────────────────────────────────────────────

formulas:

  - name: damage_application_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - current_hp
      - damage_amount
      - new_hp
    output_range: [0.0, "max_hp of target"]
    expression: "new_hp = max(0, current_hp - damage_amount)"
    notes: "Universal damage application. HP can never go negative. Overkill is not stored."
    added: 2026-05-25
    revised: ""

  - name: weapon_dps_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - damage
      - cooldown
    output_range: [0, 4000]
    expression: "dps = damage / cooldown"
    notes: "Theoretical single-target DPS for non-multi-target weapons. cooldown floor is MIN_COOLDOWN=0.05."
    added: 2026-05-25
    revised: ""

  - name: multi_target_effective_dps
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - damage
      - hits_per_tick
      - tick_rate
    output_range: ["scales linearly with hits_per_tick", "no upper cap"]
    expression: "effective_dps = (damage * hits_per_tick) / tick_rate"
    notes: "Used for Bagua Array, Thunder Law radius weapons, and any tick-based combat. tick_rate floor is MIN_TICK_RATE=0.05."
    added: 2026-05-25
    revised: ""

  - name: damage_interval_throttle
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - current_time
      - last_hit_time
      - damage_interval
    output_range: [false, true]
    expression: "can_hit = (current_time - last_hit_time) >= damage_interval"
    notes: "Per-enemy throttle for enemy→player damage. damage_interval floor is MIN_DAMAGE_INTERVAL=0.1. On spawn, last_hit_time = current_time - damage_interval (no grace period — enemy can hit immediately on contact)."
    added: 2026-05-25
    revised: "2026-05-25"

  - name: burn_fixed_step_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - burn_dps
      - BURN_TICK_INTERVAL
      - burn_duration
    output_range: ["0", "burn_dps × burn_duration"]
    expression: "tick_damage = burn_dps × 0.1, applied per fixed-step accumulator at 0.1s intervals over burn_duration"
    notes: "Frame-rate independent. Engine constant BURN_TICK_INTERVAL = 0.1s. Decoupled from _process delta. Closes /design-review blocker #3 (frame-rate dependency)."
    added: 2026-05-25
    revised: ""

  - name: pierce_damage_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - raw_damage
      - source_modifier
      - crit_multiplier
      - element_modifier
      - pierce_falloff
    output_range: ["per-hit, equal to final_damage from Formula 1"]
    expression: "damage_per_pierce_hit = raw_damage × source_modifier × crit_multiplier × element_modifier × pierce_falloff; pierce_falloff = 1.0 in v0.4 baseline"
    notes: "Each pierce hit takes full damage. pierce_count = N means initial hit + N additional = N+1 enemies max. pierce_falloff slot reserved for future weapon designs needing reduced damage on subsequent pierces."
    added: 2026-05-25
    revised: ""

  - name: aggregate_dps_ceiling_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - contact_attackers
      - MAX_CONTACT_ATTACKERS
      - active_attackers
    output_range: ["0", "MAX_CONTACT_ATTACKERS × (1 / average_damage_interval) hits per second"]
    expression: "active_attackers = contact_attackers sorted by entry_time descending [0:MAX_CONTACT_ATTACKERS]; queued_attackers do not update last_hit_time"
    notes: "Closes /design-review blocker #2 (aggregate DPS uncapped). Enforces Pressure Curve §Survival Budget. MAX_CONTACT_ATTACKERS = 4 (engine constant, not designer-tunable)."
    added: 2026-05-25
    revised: ""

  - name: player_xp_curve
    status: active
    source: design/gdd/player-system.md
    referenced_by:
      - design/gdd/player-system.md
    variables:
      - level
      - initial_xp_to_next_level
      - xp_growth_multiplier
      - xp_growth_flat
    output_range: ["18 (L1)", "~4000 (L20, recursive ceilf path-dependent)"]
    expression: "xp_threshold(1) = initial_xp_to_next_level; for L >= 2: xp_threshold(L) = ceil(max(xp_threshold(L-1) × max(mu, 1.0) + max(delta, 0.0), xp_threshold(L-1) + 1.0))"
    notes: "RECURSIVE with ceilf clamp and strict-monotonic floor. NOT closed-form. Each step rounds up, accumulates across levels. Defaults x0=18, mu=1.28, delta=6 produce: L2=30, L3=45, L5=88, L6=119, L10=358. Player GDD revision-1 corrects the formula expression after /design-review B-1 found it was previously documented as closed-form."
    added: 2026-05-25
    revised: "2026-05-25"

  - name: player_xp_gain
    status: active
    source: design/gdd/player-system.md
    referenced_by:
      - design/gdd/player-system.md
    variables:
      - amount
      - xp_gain_multiplier
    output_range: ["0", "amount × upgrade-stacked multiplier (max ~3.0)"]
    expression: "effective_amount = amount × xp_gain_multiplier; while current_xp >= xp_to_next_level(level): current_xp -= threshold; level += 1; emit level_reached(level)"
    notes: "Handles multi-level carry-over: a single high-XP gain (e.g. Boss kill late-game) can fire level_reached multiple times. Level Up panel stacks offers."
    added: 2026-05-25
    revised: ""

  - name: player_pickup_radius
    status: active
    source: design/gdd/player-system.md
    referenced_by:
      - design/gdd/player-system.md
    variables:
      - CharacterBase_pickup_radius
      - pickup_radius_bonus
    output_range: ["30", "~150 (upgrade-stacked)"]
    expression: "effective_pickup_radius = CharacterBase.pickup_radius + pickup_radius_bonus"
    notes: "Pickup System reads this at query time. CharacterBase.pickup_radius default for 修行者 is 50. pickup_radius_bonus default 0, upgrade-stack cap ~100."
    added: 2026-05-25
    revised: ""

